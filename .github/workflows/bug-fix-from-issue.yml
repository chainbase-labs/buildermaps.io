name: JSON Edit AI Agent

permissions:
  contents: write
  pull-requests: write
  issues: write

on:
  issues:
    types: [opened, labeled]

jobs:
  json-agent:
    runs-on: ubuntu-latest

    steps:

      - name: Check label
        id: check
        run: |
          LABELS='${{ toJson(github.event.issue.labels) }}'
          if echo "$LABELS" | grep -q "bug-fixing"; then
            echo "trigger=true" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.trigger == 'true'

      - name: Setup git
        run: |
          git config user.name "json-ai-agent"
          git config user.email "ai@agent.com"

      - name: Generate JSON edits
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |

          FILE_TREE=$(git ls-files | head -n 200)

          PROMPT="Return ONLY JSON array.

          Issue:
          $ISSUE_TITLE
          $ISSUE_BODY

          Files:
          $FILE_TREE

          Format:

          [
            {
              \"file\":\"path\",
              \"search\":\"exact old code\",
              \"replace\":\"new code\"
            }
          ]
          "

          BODY=$(jq -n --arg content "$PROMPT" '{
            model:"openai/gpt-5",
            messages:[{role:"user",content:$content}]
          }')

          RESPONSE=$(echo "$BODY" | curl -s \
            https://models.github.ai/inference/chat/completions \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            -d @-)

          echo "$RESPONSE"

          echo "$RESPONSE" | jq -r '.choices[0].message.content[0].text' > edits.json

      - name: Apply JSON edits
        run: |

          git checkout -b ai-fix-${{ github.event.issue.number }}

          jq -c '.[]' edits.json | while read edit; do

            FILE=$(echo "$edit" | jq -r '.file')
            SEARCH=$(echo "$edit" | jq -r '.search')
            REPLACE=$(echo "$edit" | jq -r '.replace')

            if [ -f "$FILE" ]; then
              echo "Editing $FILE"
              sed -i "s|$SEARCH|$REPLACE|g" "$FILE"
            fi
          done

          git add .
          git commit -m "JSON edit AI fix"
          git push origin HEAD

      - name: Create PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create --title "JSON AI fix" --body "Automated fix"
