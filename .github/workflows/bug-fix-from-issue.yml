name: Silent AI Bug Fix Agent

permissions:
  contents: write
  pull-requests: write
  issues: write

on:
  issues:
    types: [opened, labeled]

jobs:
  silent-agent:
    runs-on: ubuntu-latest

    steps:

      - name: Check bug-fixing label
        id: check
        run: |
          LABELS='${{ toJson(github.event.issue.labels) }}'

          if echo "$LABELS" | grep -q "bug-fixing"; then
            echo "trigger=true" >> $GITHUB_OUTPUT
          else
            echo "trigger=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repo
        if: steps.check.outputs.trigger == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup git
        if: steps.check.outputs.trigger == 'true'
        run: |
          git config user.name "silent-ai-agent"
          git config user.email "ai@agent.com"

      - name: Generate patch using GitHub Models
        if: steps.check.outputs.trigger == 'true'
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |

          PROMPT="You are an autonomous senior developer.

          Fix the bug described below.

          Output ONLY unified diff patch.
          No explanations.
          No markdown.

          Issue Title:
          $ISSUE_TITLE

          Issue Body:
          $ISSUE_BODY
          "

          PROMPT_JSON=$(jq -Rs . <<< "$PROMPT")

          RESPONSE=$(curl -s -X POST "https://models.github.ai/inference/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            --data @- <<JSON
            {
              "model": "openai/gpt-5",
              "messages": [
                {
                  "role": "user",
                  "content": $PROMPT_JSON
                }
              ],
              "max_tokens": 2000,
              "temperature": 0.2
            }
            JSON
          )

          echo "RAW RESPONSE:"
          echo "$RESPONSE"

          PATCH=$(echo "$RESPONSE" | jq -r '.choices[0].message.content[0].text')

          if [ -z "$PATCH" ] || [ "$PATCH" == "null" ]; then
            echo "Failed to generate patch"
            exit 1
          fi

          echo "$PATCH" > fix.diff

      - name: Apply patch and commit
        if: steps.check.outputs.trigger == 'true'
        run: |
          git checkout -b ai-fix-${{ github.event.issue.number }}

          git apply fix.diff

          git add .
          git commit -m "AI silent fix for issue #${{ github.event.issue.number }}"

          git push origin HEAD

      - name: Create Pull Request
        if: steps.check.outputs.trigger == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "AI Silent Fix for #${{ github.event.issue.number }}" \
            --body "Automatically generated by Silent AI Agent."
