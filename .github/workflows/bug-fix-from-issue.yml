name: AST AI Agent

permissions:
  contents: write
  pull-requests: write
  issues: write

on:
  issues:
    types: [opened, labeled]

jobs:
  ast-agent:
    runs-on: ubuntu-latest

    steps:

      - name: Check label
        id: check
        run: |
          LABELS='${{ toJson(github.event.issue.labels) }}'
          if echo "$LABELS" | grep -q "bug-fixing"; then
            echo "trigger=true" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.trigger == 'true'

      - name: Install deps
        run: |
          npm install ts-morph --legacy-peer-deps  

      - name: Generate AST edits
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |

          PROMPT="Return JSON AST actions only.

          Example:

          [
          {
            \"action\":\"add_import\",
            \"file\":\"src/App.tsx\",
            \"import\":\"useEffect\",
            \"from\":\"react\"
          }
          ]

          Issue:
          $ISSUE_TITLE
          $ISSUE_BODY
          "

          BODY=$(jq -n --arg content "$PROMPT" '{
            model:"openai/gpt-5",
            messages:[{role:"user",content:$content}]
          }')

          RESPONSE=$(echo "$BODY" | curl -s \
            https://models.github.ai/inference/chat/completions \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            -d @-)

          echo "$RESPONSE" | jq -r '.choices[0].message.content[0].text' > ast.json

      - name: Apply AST edits
        run: |
          node scripts/apply-ast.js

      - name: Commit & PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "ast-agent"
          git config user.email "ai@agent.com"

          git checkout -b ai-fix-${{ github.event.issue.number }}

          git add .
          git commit -m "AST AI fix"

          git push origin HEAD

          gh pr create --title "AST AI Fix" --body "AST-based auto fix"
