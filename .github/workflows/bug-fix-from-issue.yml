name: Repo Aware AI Agent

permissions:
  contents: write
  pull-requests: write
  issues: write

on:
  issues:
    types: [opened, labeled]

jobs:
  repo-agent:
    runs-on: ubuntu-latest

    steps:

      - name: Check label
        id: check
        run: |
          LABELS='${{ toJson(github.event.issue.labels) }}'
          if echo "$LABELS" | grep -q "bug-fixing"; then
            echo "trigger=true" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.trigger == 'true'

      - name: Install ripgrep
        run: sudo apt-get install ripgrep -y

      - name: Planner (decide search query)
        if: steps.check.outputs.trigger == 'true'
        id: planner
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |

          PROMPT="Return ONE search keyword only.

          Issue:
          $ISSUE_TITLE
          $ISSUE_BODY"

          BODY=$(jq -n --arg content "$PROMPT" '{
            model:"openai/gpt-5",
            messages:[{role:"user",content:$content}]
          }')

          RESPONSE=$(echo "$BODY" | curl -s \
            https://models.github.ai/inference/chat/completions \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            -d @-)

          QUERY=$(echo "$RESPONSE" | jq -r '.choices[0].message.content[0].text')

          echo "query=$QUERY" >> $GITHUB_OUTPUT

      - name: Search repo
        id: search
        run: |
          rg "${{ steps.planner.outputs.query }}" -l | head -n 10 > files.txt

      - name: Load context
        run: |
          CONTEXT=""
          for f in $(cat files.txt); do
            CONTEXT="$CONTEXT\nFILE:$f\n$(cat $f)"
          done
          echo "$CONTEXT" > context.txt

      - name: Generate patch
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |

          CODE=$(cat context.txt)

          PROMPT="Return ONLY unified diff.

          Issue:
          $ISSUE_TITLE
          $ISSUE_BODY

          Code:
          $CODE"

          BODY=$(jq -n --arg content "$PROMPT" '{
            model:"openai/gpt-4o-mini",
            messages:[{role:"user",content:$content}]
          }')

          RESPONSE=$(echo "$BODY" | curl -s \
            https://models.github.ai/inference/chat/completions \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            -d @-)

          echo "$RESPONSE" | jq -r '.choices[0].message.content[0].text' > fix.diff

      - name: Apply patch
        run: |
          git checkout -b ai-fix-${{ github.event.issue.number }}
          git apply fix.diff
          git add .
          git commit -m "Repo-aware AI fix"
          git push origin HEAD

      - name: Create PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create --title "Repo-aware AI fix" --body "Auto fix"
