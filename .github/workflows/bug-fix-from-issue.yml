name: Assign to Copilot with Verification

on:
  issues:
    types: [labeled]

jobs:
  assign-to-copilot:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'bug-fix')
    
    steps:
      - name: Assign and verify Copilot
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue_number = context.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            try {
              // Try to assign to Copilot
              await github.rest.issues.addAssignees({
                owner,
                repo,
                issue_number,
                assignees: ['copilot']
              });
              
              console.log('✅ Assignment request sent');
              
              // Wait and verify
              await new Promise(resolve => setTimeout(resolve, 3000));
              
              const { data: updatedIssue } = await github.rest.issues.get({
                owner,
                repo,
                issue_number
              });
              
              const isCopilotAssigned = updatedIssue.assignees.some(a => a.login === 'copilot');
              
              if (isCopilotAssigned) {
                console.log('✅ Copilot successfully assigned!');
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number,
                  body: '✅ Copilot has been assigned and will create a PR shortly.'
                });
              } else {
                console.log('❌ Copilot assignment failed - feature may not be enabled');
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number,
                  body: '⚠️ Failed to assign to Copilot. Please check:\n\n' +
                        '1. Copilot coding agent is enabled for this repository\n' +
                        '2. You have a valid Copilot Pro/Business/Enterprise subscription\n' +
                        '3. See: https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-for-organization/add-copilot-coding-agent'
                });
                core.setFailed('Copilot assignment verification failed');
              }
              
            } catch (error) {
              console.error('❌ Error:', error.message);
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: `❌ Error assigning to Copilot: ${error.message}\n\nPlease enable Copilot coding agent for this repository.`
              });
              throw error;
            }