name: Auto-assign to Copilot with checks

on:
  issues:
    types: [labeled, opened]

jobs:
  assign-to-copilot:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'bug-fix')
    
    steps:
      - name: Check and assign Copilot
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue_number = context.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            // Get current issue details
            const { data: issue } = await github.rest.issues.get({
              owner,
              repo,
              issue_number
            });
            
            // Check if Copilot is already assigned
            const assignees = issue.assignees.map(a => a.login);
            const isCopilotAssigned = assignees.includes('copilot');
            
            console.log(`Current assignees: ${assignees.join(', ')}`);
            console.log(`Is Copilot assigned: ${isCopilotAssigned}`);
            
            if (isCopilotAssigned) {
              console.log('✅ Copilot is already assigned to this issue');
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: '✅ Copilot is already working on this issue.'
              });
            } else {
              console.log('➕ Assigning issue to Copilot...');
              await github.rest.issues.addAssignees({
                owner,
                repo,
                issue_number,
                assignees: ['copilot']
              });
              
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: '🤖 This issue has been automatically assigned to Copilot for resolution.'
              });
              
              console.log('✅ Successfully assigned to Copilot');
            }