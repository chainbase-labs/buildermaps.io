name: AST Loop AI Agent

permissions:
  contents: write
  pull-requests: write
  issues: write

on:
  issues:
    types: [opened, labeled]

jobs:
  ast-loop:
    runs-on: ubuntu-latest

    steps:

      - name: Check label
        id: check
        run: |
          LABELS='${{ toJson(github.event.issue.labels) }}'
          if echo "$LABELS" | grep -q "bug-fixing"; then
            echo "trigger=true" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.trigger == 'true'

      - name: Install deps
        run: npm install ts-morph --legacy-peer-deps  

      - name: Setup git
        run: |
          git config user.name "ast-loop-agent"
          git config user.email "ai@agent.com"

      - name: AI loop
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |

          git checkout -b ai-fix-${{ github.event.issue.number }}-run-${{ github.run_id }}

          ERROR=""

          for i in 1 2 3; do

            echo "===== LOOP $i ====="

            PROMPT="Return JSON AST edits.

            Issue:
            $ISSUE_TITLE
            $ISSUE_BODY

            Last error:
            $ERROR

            Format:
            [
              {\"action\":\"add_import\",\"file\":\"src/App.tsx\",\"import\":\"useEffect\",\"from\":\"react\"}
            ]"

            BODY=$(jq -n --arg content "$PROMPT" '{
              model:"openai/gpt-5",
              messages:[{role:"user",content:$content}]
            }')

            RESPONSE=$(echo "$BODY" | curl -s \
              https://models.github.ai/inference/chat/completions \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d @-)

            RAW=$(echo "$RESPONSE" | jq -r '
              .choices[0].message.content
              | if type=="string" then .
                else map(.text) | join("")
                end
            ')

            RAW=$(echo "$RAW" | sed 's/```json//g' | sed 's/```//g')

            echo "$RAW" > ast.json

            node scripts/apply-ast.js || true

            npm run build || ERROR=$(npm run build 2>&1)

            if [ -z "$ERROR" ]; then
              echo "Build success"
              break
            fi

          done

      - name: Commit & PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add .
          git commit -m "AST loop AI fix" || echo "No changes"
          git push origin HEAD

          gh pr create --title "AST Loop AI Fix" --body "Self-healing AST agent"
