name: Auto Trigger Copilot Agent

permissions:
  issues: write
  contents: write
  pull-requests: write

on:
  issues:
    types: [opened, labeled]

jobs:
  trigger-agent:
    runs-on: ubuntu-latest

    steps:

      - name: Check bug-fixing label
        id: check
        run: |
          LABELS='${{ toJson(github.event.issue.labels) }}'

          if echo "$LABELS" | grep -q "bug-fixing"; then
            echo "trigger=true" >> $GITHUB_OUTPUT
          else
            echo "trigger=false" >> $GITHUB_OUTPUT
          fi

      # ⭐ 不使用 gh issue comment（减少失败）
      - name: Trigger Copilot via GitHub API
        if: steps.check.outputs.trigger == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |

          curl -X POST \
          -H "Authorization: Bearer $GH_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments \
          -d '{
            "body": "@copilot fix this issue and create a pull request"
          }'
